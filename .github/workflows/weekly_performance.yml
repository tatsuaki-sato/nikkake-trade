name: Weekly Performance Tracker (Saturday)

on:
  schedule:
    # JST 10:00 Saturday -> UTC 01:00 Saturday
    - cron: '0 1 * * 6'
  workflow_dispatch:

jobs:
  run-weekly-performance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Weekly Performance Tracker & Send LINE Report
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python modules/post_analysis/weekly_report_runner.py
        
      - name: Commit and push updated performance history & dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signal_history.json dashboard.html
          git commit -m "Auto-update AI Performance History & Dashboard [skip ci]" || echo "No changes to commit"
          git push origin main

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trade Signal Performance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; padding: 20px; }
        .card-stat { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">🤖 AI Trade Signal Performance Dashboard</h2>
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card card-stat bg-white p-3 text-center">
                    <div class="text-muted">通算勝率</div>
                    <div class="display-5 text-primary font-weight-bold">0.0%</div>
                    <small>0勝 0敗</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-white p-3 text-center">
                    <div class="text-muted">確定累積リターン</div>
                    <div class="display-5 text-success">+0.0%</div>
                    <small>全利確・損切り決済合計</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-white p-3 text-center">
                    <div class="text-muted">総シグナル数</div>
                    <div class="display-5 text-dark">1件</div>
                    <small>監視中: 1件</small>
                </div>
            </div>
        </div>

        <div class="card bg-white p-4 card-stat">
            <h5>📋 シグナル勝敗・実測追跡履歴</h5>
            <table class="table table-hover mt-3">
                <thead class="table-light">
                    <tr>
                        <th>推奨日</th>
                        <th>銘柄</th>
                        <th>スコア</th>
                        <th>推奨価格</th>
                        <th>目標利確</th>
                        <th>損切り</th>
                        <th>最新/最終株価</th>
                        <th>リターン</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody>
                    
        <tr>
            <td>2026-08-02</td>
            <td><strong>7203</strong></td>
            <td>85点</td>
            <td>3,000.0円</td>
            <td>3,270.0円</td>
            <td>2,820.0円</td>
            <td>3,000.0円</td>
            <td><strong>+0.00%</strong></td>
            <td><span class="badge bg-warning">OPEN 監視中</span></td>
        </tr>
        
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
